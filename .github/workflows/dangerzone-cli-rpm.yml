name: Dangerzone CLI RPM (Fedora 45)

on:
  # Automatic: poll upstream Releases every six hours.
  schedule:
    - cron: '17 */6 * * *'
  # Manual: build immediately, even without an upstream Release.
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream source: main, vX.Y.Z tag, or 40-character commit SHA'
        required: true
        default: main
        type: string
      publish_release:
        description: 'Also publish a uniquely named GitHub Release (manual runs only)'
        required: true
        default: false
        type: boolean

# Upstream source is only executed by the read-only build job.
permissions: {}
concurrency:
  group: dangerzone-cli-fc45-release
  cancel-in-progress: false

jobs:
  check:
    name: Select upstream source
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      should_publish: ${{ steps.detect.outputs.should_publish }}
      upstream_ref: ${{ steps.detect.outputs.upstream_ref }}
      requested_ref: ${{ steps.detect.outputs.requested_ref }}
      version: ${{ steps.detect.outputs.version }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
    steps:
      - name: Decide whether to build
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            # Manual builds do NOT depend on any upstream GitHub Release.
            # Pin the ref to an exact commit so the check/build jobs see the same source.
            ref="${INPUT_REF:-main}"
            if [[ ! "$ref" =~ ^(main|v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-fA-F]{40})$ ]]; then
              echo "Use main, vX.Y.Z, or a 40-character upstream commit SHA: $ref" >&2
              exit 1
            fi
            sha="$(gh api "repos/freedomofpress/dangerzone/commits/$ref" --jq '.sha')"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Failed to resolve upstream ref $ref to a commit" >&2
              exit 1
            }
            # Read the version recorded in the selected source, not in latest Release.
            encoded="$(gh api -X GET \
              'repos/freedomofpress/dangerzone/contents/share/version.txt' \
              -f "ref=$sha" --jq '.content')"
            version="$(printf '%s' "$encoded" | base64 --decode | tr -d '[:space:]')"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid upstream share/version.txt from $sha: $version" >&2
              exit 1
            }
            {
              echo 'should_build=true'
              echo "should_publish=${INPUT_PUBLISH:-false}"
              echo "upstream_ref=$sha"
              echo "requested_ref=$ref"
              echo "version=$version"
              # Every manual publish gets a unique tag: no clashes with earlier runs.
              echo "release_tag=manual-v${version}-fc45-run${GITHUB_RUN_ID}"
            } >> "$GITHUB_OUTPUT"
            echo "Manual build requested: $ref -> $sha ($version)"
            exit 0
          fi

          # Scheduled builds ONLY follow stable official upstream Releases.
          tag="$(gh api repos/freedomofpress/dangerzone/releases/latest --jq '.tag_name')"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported upstream stable Release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          release_tag="cli-${tag}-fc45"
          {
            echo "upstream_ref=$tag"
            echo "requested_ref=$tag"
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo 'should_publish=false'
          } >> "$GITHUB_OUTPUT"

          # This patch set was developed against Dangerzone 0.11.1 onward.
          oldest="$(printf '%s\n' '0.11.1' "$version" | sort -V | head -n 1)"
          if [[ "$oldest" != '0.11.1' ]]; then
            echo "Skip $tag: older than supported baseline v0.11.1"
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Local GitHub Release serves as the marker for already built versions.
          # Fail instead of building on auth errors, rate limits or other API failures.
          http_status="$(curl --silent --show-error --location \
            --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")"
          case "$http_status" in
            200)
              echo "Skip $tag: $release_tag already published"
              echo 'should_build=false' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Build new official release: $tag"
              {
                echo 'should_build=true'
                echo 'should_publish=true'
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "GitHub Release lookup failed (HTTP $http_status)" >&2
              exit 1
              ;;
          esac

  build:
    name: Build CLI-only x86_64 RPM in Fedora 45
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out our build script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build inside an isolated Fedora 45 Docker container
        shell: bash
        env:
          UPSTREAM_REF: ${{ needs.check.outputs.upstream_ref }}
          UPSTREAM_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          docker run --rm --platform linux/amd64 \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --env "DANGERZONE_REF=$UPSTREAM_REF" \
            --env "DANGERZONE_VERSION=$UPSTREAM_VERSION" \
            --env DANGERZONE_OUT_DIR=/workspace/artifacts \
            docker.io/library/fedora:45 \
            bash ./scripts/build-dangerzone-cli-f45.sh

      - name: Upload RPM, checksums and build evidence
        uses: actions/upload-artifact@v7
        with:
          name: dangerzone-cli-${{ needs.check.outputs.version }}-fc45-run${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish RPM to our GitHub Releases
    needs: [check, build]
    if: needs.check.outputs.should_publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download checked build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dangerzone-cli-${{ needs.check.outputs.version }}-fc45-run${{ github.run_id }}
          path: artifacts/

      - name: Verify checksum and create a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ needs.check.outputs.requested_ref }}
          UPSTREAM_SHA_OR_TAG: ${{ needs.check.outputs.upstream_ref }}
          UPSTREAM_VERSION: ${{ needs.check.outputs.version }}
          LOCAL_RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          rpms=(artifacts/dangerzone-cli-*.fc45.x86_64.rpm)
          sums=(artifacts/*.sha256)
          [[ "${#rpms[@]}" -eq 1 && "${#sums[@]}" -eq 1 ]] || {
            echo 'Expected exactly one RPM and SHA256 manifest' >&2
            exit 1
          }
          (cd artifacts && sha256sum --check "$(basename "${sums[0]}")")

          gh release create "$LOCAL_RELEASE_TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dangerzone CLI $UPSTREAM_VERSION (Fedora 45 x86_64)" \
            --notes "Unofficial, UNSIGNED CLI-only Fedora 45 RPM. Upstream source: $SOURCE_REF (resolved: $UPSTREAM_SHA_OR_TAG). English OCR, GUI removed. Includes dependency list, file manifest, source patch and SHA256. A manual build may use unreleased upstream source; this is NOT an official Dangerzone package." \
            --latest=false
